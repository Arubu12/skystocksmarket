<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Stocks Market</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#07111f;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:#0d1b2a;
position:sticky;
top:0;
}

.logo{
font-size:28px;
font-weight:bold;
color:#FFD700;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-size:16px;
}

nav a:hover{
color:#FFD700;
}

.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:linear-gradient(135deg,#0d1b2a,#1b4965);
}

.hero h1{
font-size:48px;
margin-bottom:20px;
}

.hero p{
max-width:700px;
font-size:20px;
line-height:1.7;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:15px 35px;
background:#FFD700;
color:#07111f;
font-weight:bold;
text-decoration:none;
border-radius:30px;
}

.btn:hover{
background:white;
}
</style>

</head>

<body>

<header>

<div class="logo">
Sky Stocks Market
</div>

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
<a href="#">Login</a>
</nav>

</header>

<section class="hero">

<h1>Invest with Confidence</h1>

<p>
Welcome to Sky Stocks Market. Explore market insights, educational resources, and portfolio tools designed to help you make informed financial decisions.
</p>

<a href="#" class="btn">
Get Started
</a>

</section>

</body>
</html>
